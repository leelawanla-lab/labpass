<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LabPass · CEG23167</title><link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script>window.LABPASS_CONFIG={"url": "https://lnkywpjkrdjcyoppgncv.supabase.co", "anonKey": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxua3l3cGprcmRqY3lvcHBnbmN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5NDE3NDgsImV4cCI6MjEwNzUxNzc0OH0.lpzgHqjCuww2mQBB6qNg8sn_wyh40mTVoKIT0v6RmBM", "allowedDomains": ["spumail.net", "spu.ac.th"], "aiEndpoint": ""};</script><script>/* LabPass web edition: replaces the claude.ai Artifact runtime with Supabase */
(function(){
const CFG=window.LABPASS_CONFIG||{};
const sb=window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});
window.LP_SB=sb;
let session=null,isTeacherFlag=false;

/* ---------- db shim (Firestore-like API used by the app) ---------- */
const docListeners=new Map();   // path -> Set(cb)
const collListeners=new Map();  // coll -> Set(cb)
function snapDoc(path,row){const id=path.split("/").pop();return{id,exists:!!row,data:()=>row?JSON.parse(JSON.stringify(row.data)):undefined}}
async function readDoc(path){const{data,error}=await sb.from("docs").select("data").eq("path",path).maybeSingle();if(error)throw error;return data}
async function readColl(c){const{data,error}=await sb.from("docs").select("id,data").eq("coll",c);if(error)throw error;return data||[]}
/* Local cache + realtime payloads: after the first load, changes arrive with their data, so the app
   re-reads almost nothing from Supabase (keeps a 300-400 student course inside the free 5 GB/month). */
const docCache=new Map();   // path -> data | null
const collCache=new Map();  // coll -> Map(id -> data)
const cp=o=>o==null?o:JSON.parse(JSON.stringify(o));
function deepMerge(a,b){if(a&&b&&typeof a==="object"&&typeof b==="object"&&!Array.isArray(a)&&!Array.isArray(b)){const o={...a};for(const k of Object.keys(b))o[k]=k in a?deepMerge(a[k],b[k]):b[k];return o}return b}
function emitDoc(path){const ls=docListeners.get(path);if(!ls||!ls.size||!docCache.has(path))return;const d=docCache.get(path);const s=snapDoc(path,d==null?null:{data:d});ls.forEach(f=>{try{f(s)}catch(e){console.warn(e)}})}
function emitColl(c){const ls=collListeners.get(c),m=collCache.get(c);if(!ls||!ls.size||!m)return;const s={docs:[...m].map(([id,d])=>({id,exists:true,data:()=>cp(d)}))};ls.forEach(f=>{try{f(s)}catch(e){console.warn(e)}})}
function applyRow(path,data){const[c,id]=path.split("/");if(docListeners.has(path)||docCache.has(path)){docCache.set(path,data);emitDoc(path)}const m=collCache.get(c);if(m){if(data==null)m.delete(id);else m.set(id,data);emitColl(c)}}
async function fireDoc(path){try{const r=await readDoc(path);applyRow(path,r?r.data:null)}catch(e){console.warn(e)}}
async function fireColl(c){const ls=collListeners.get(c);if(!ls||!ls.size)return;try{const rows=await readColl(c);collCache.set(c,new Map(rows.map(r=>[r.id,r.data])));emitColl(c)}catch(e){console.warn(e)}}
function cached(path){const[c,id]=path.split("/");if(docCache.has(path))return{ok:true,d:docCache.get(path)};const m=collCache.get(c);if(m)return{ok:true,d:m.has(id)?m.get(id):null};return{ok:false}}
const lastBeat=new Map();const pend=new Map();function schedule(path){clearTimeout(pend.get(path));pend.set(path,setTimeout(()=>fireDoc(path),300))}
function clean(o){return JSON.parse(JSON.stringify(o===undefined?null:o))}
const db={
 doc(path){return{id:path.split("/").pop(),path,
  async get(){return snapDoc(path,await readDoc(path))},
  async set(d){const v=clean(d);const{error}=await sb.from("docs").upsert({path,coll:path.split("/")[0],id:path.split("/")[1],data:v});if(error)throw error;applyRow(path,v)},
  async update(d){const v=clean(d);
   if(v&&typeof v==="object"&&Object.keys(v).length===1&&v.progress){const k=path,pr=v.progress,last=lastBeat.get(k),now=Date.now();
    if(last&&last.mid===pr.mid&&last.part===pr.part&&now-last.t<240000){const c=cached(path);if(c.ok&&c.d!=null)applyRow(path,deepMerge(c.d,v));return}
    lastBeat.set(k,{mid:pr.mid,part:pr.part,t:now})}
const{error}=await sb.rpc("doc_merge",{p:path,patch:v});if(error)throw error;const c=cached(path);if(c.ok&&c.d!=null)applyRow(path,deepMerge(c.d,v));else fireDoc(path)},
  async delete(){const{error}=await sb.from("docs").delete().eq("path",path);if(error)throw error;applyRow(path,null)},
  onSnapshot(cb,err){if(!docListeners.has(path))docListeners.set(path,new Set());docListeners.get(path).add(cb);
   if(docCache.has(path)){const d=docCache.get(path);setTimeout(()=>cb(snapDoc(path,d==null?null:{data:d})),0)}
   else readDoc(path).then(r=>{docCache.set(path,r?r.data:null);cb(snapDoc(path,r))}).catch(e=>err&&err(e));
   return()=>docListeners.get(path).delete(cb)}}},
 collection(c){return{onSnapshot(cb,err){if(!collListeners.has(c))collListeners.set(c,new Set());collListeners.get(c).add(cb);
   readColl(c).then(rows=>{collCache.set(c,new Map(rows.map(r=>[r.id,r.data])));cb({docs:rows.map(r=>({id:r.id,exists:true,data:()=>cp(r.data)}))})}).catch(e=>err&&err(e));return()=>collListeners.get(c).delete(cb)},
   async get(){const rows=await readColl(c);return{docs:rows.map(r=>({id:r.id,exists:true,data:()=>r.data}))}}}}
};
let rtOK=false,chan=null;
function refreshAll(withColl){docListeners.forEach((ls,p)=>{if(ls.size)fireDoc(p)});if(withColl)collListeners.forEach((_,c)=>fireColl(c))}
function rtOn(){if(chan)return;chan=sb.channel("docs-live").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{
   if(p.eventType==="DELETE"){const path=p.old&&p.old.path;if(path)applyRow(path,null);return}
   const n=p.new||{};if(!n.path)return;
   if(n.data&&typeof n.data==="object")applyRow(n.path,n.data);else schedule(n.path)
 }).subscribe(st=>{const was=rtOK;rtOK=st==="SUBSCRIBED";if(rtOK&&!was)refreshAll(true)})}
function rtOff(){if(!chan)return;sb.removeChannel(chan);chan=null;rtOK=false}
function startRealtime(){
 // Students write their own data and see it immediately (local cache), so only the teacher view listens live.
 if(isTeacherFlag){
  rtOn();
  setInterval(()=>{if(document.visibilityState==="visible"&&!rtOK)refreshAll(false)},60000);
  setInterval(()=>{if(document.visibilityState==="visible")refreshAll(true)},600000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")rtOn();else rtOff()});
 }else{
  setInterval(()=>{if(document.visibilityState==="visible")refreshAll(false)},600000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refreshAll(false)});
 }
}

/* ---------- user / downloads / sample ---------- */
const user={id:async()=>session.user.id,me:async()=>({id:session.user.id,name:session.user.email}),canEdit:async()=>isTeacherFlag,isOwner:async()=>isTeacherFlag,profiles:async()=>({}),search:async()=>[]};
const downloads={async save({filename,data}){const blob=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return{saved:true}}};
let sampleFn=null;
if(CFG.aiEndpoint){
 sampleFn=async function(input,opts={}){const tok=session?.access_token;const r=await fetch(CFG.aiEndpoint,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok},body:JSON.stringify({input,images:opts.images?await Promise.all(opts.images.map(toB64)):undefined}),signal:opts.signal});
  if(r.status===429)throw{code:"rate_limited"};if(!r.ok)throw{code:"unavailable"};const j=await r.json();if(opts.onText)opts.onText({text:j.text,delta:j.text});return{text:j.text,truncated:false}};
 sampleFn.json=async(input,opts)=>{const r=await sampleFn(input,opts);const m=r.text.match(/[\[{][\s\S]*[\]}]/);if(!m)throw{code:"invalid_json"};return JSON.parse(m[0])};
 sampleFn.limits=async()=>({maxPromptBytes:60000,images:{maxCount:1,maxInputBytes:4e6}});
}
async function toB64(b){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b)})}
window.claude={use:async(n)=>n==="db"?db:n==="user"?user:n==="downloads"?downloads:n==="sample"?sampleFn:null};

/* ---------- login screen ---------- */
function loginHTML(msg){return`<section class="sheet" style="max-width:520px;margin:40px auto">
 <div class="tab">เข้าสู่ระบบ LabPass</div>
 <h2 style="margin:6px 0 4px">ใช้อีเมลมหาวิทยาลัย</h2><p class="small" style="margin:0 0 6px"><b>นักศึกษา</b> @spumail.net · <b>อาจารย์</b> @spu.ac.th</p>
 <p class="small muted">ครั้งแรกให้กด <b>สมัครครั้งแรก</b> ตั้งรหัสผ่านอย่างน้อย 6 ตัว ครั้งต่อไปกด <b>เข้าสู่ระบบ</b> ด้วยอีเมลและรหัสผ่านเดิม</p>
 <div class="q"><label class="ql" for="lpe">อีเมลมหาวิทยาลัย</label><input id="lpe" type="email" autocomplete="email" placeholder="เช่น ชื่อ.นามสกุล3ตัว@spumail.net"></div>
 <div class="q"><label class="ql" for="lpp">รหัสผ่าน</label><input id="lpp" type="password" autocomplete="current-password" placeholder="อย่างน้อย 6 ตัว"></div>
 <p id="lpm" class="small" style="color:#B42318;min-height:1.2em">${msg||""}</p>
 <div style="display:flex;gap:10px;flex-wrap:wrap"><button id="lpin">เข้าสู่ระบบ</button><button id="lpup" class="ghost">สมัครครั้งแรก</button></div>
 <p class="small muted" style="margin-top:14px">รหัสผ่านตั้งใหม่เองสำหรับ LabPass ไม่ใช่รหัสอีเมล · ลืมรหัสผ่าน แจ้งอาจารย์เพื่อรีเซ็ต</p>
 <p style="margin-top:10px"><a href="#" onclick="LP_docs();return false" style="font-weight:700">📘 คู่มือและสไลด์ชี้แจง</a></p></section>`}
function okDomain(e){const d=(CFG.allowedDomains||[]);return !d.length||d.some(x=>e.toLowerCase().endsWith("@"+x)||e.toLowerCase().endsWith("."+x))}
function showLogin(msg){const app=document.getElementById("app");app.innerHTML=loginHTML(msg);
 const go=async(kind)=>{const email=document.getElementById("lpe").value.trim().toLowerCase(),pw=document.getElementById("lpp").value;const m=document.getElementById("lpm");
  if(!/^\S+@\S+\.\S+$/.test(email)){m.textContent="ใส่อีเมลให้ถูกต้อง";return}
  if(!okDomain(email)){m.textContent="ใช้ได้เฉพาะอีเมลมหาวิทยาลัย @spumail.net (นักศึกษา) หรือ @spu.ac.th (อาจารย์)";return}
  if(pw.length<6){m.textContent="รหัสผ่านอย่างน้อย 6 ตัว";return}
  m.style.color="#3B4660";m.textContent="กำลังดำเนินการ…";
  const r=kind==="up"?await sb.auth.signUp({email,password:pw}):await sb.auth.signInWithPassword({email,password:pw});
  if(r.error){m.style.color="#B42318";m.textContent=/registered|exists/i.test(r.error.message)?"อีเมลนี้สมัครแล้ว กด เข้าสู่ระบบ แทน":/invalid/i.test(r.error.message)?"อีเมลหรือรหัสผ่านไม่ถูกต้อง":/database error|saving new user/i.test(r.error.message)?"ใช้ได้เฉพาะอีเมลมหาวิทยาลัย @spumail.net หรือ @spu.ac.th":r.error.message;return}
  if(!r.data.session){m.style.color="#B42318";m.textContent="สมัครแล้ว แต่ระบบยังต้องยืนยันอีเมล แจ้งอาจารย์";return}
  location.reload()};
 document.getElementById("lpin").onclick=()=>go("in");document.getElementById("lpup").onclick=()=>go("up");
 document.getElementById("lpp").onkeydown=e=>{if(e.key==="Enter")go("in")}}

/* ---------- manual / docs panel ---------- */
const DOCS=[["คำชี้แจง LabPass · CEG23167","01-briefing.pdf"],["คู่มือเข้าใช้ LabPass ทีละขั้น (สไลด์)","02-onboarding.pdf"],["M0 · แบบทดสอบก่อนเรียน","M0.pdf"],["M1 · ออกแบบคอนกรีตของฉัน","M1.pdf"],["M2 · วางแผนผสมจริงในห้องแล็บ","M2.pdf"],["M3 · อ่านใจเข็มไวแคท","M3.pdf"],["M4 · มอร์ตาร์ผ่านเกณฑ์ไหม","M4.pdf"],["M5 · นักสืบคอนกรีตแข็งตัว","M5.pdf"],["M6 · แบบทดสอบหลังเรียน","M6.pdf"]];
window.LP_docs=function(){let o=document.getElementById("lpdocs");if(o){o.remove();return}
 o=document.createElement("div");o.id="lpdocs";o.style.cssText="position:fixed;inset:0;z-index:100;background:rgba(11,20,51,.55);display:flex;align-items:center;justify-content:center;padding:16px";
 const list=(CFG.docs||DOCS).map(([t,f])=>`<a href="docs/${encodeURIComponent(f)}" target="_blank" rel="noopener" style="display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid #DDE3EE;border-radius:12px;text-decoration:none;color:#13224A;font-weight:600"><span>${t}</span><span style="color:#3D64E8">เปิด PDF ›</span></a>`).join("");
 o.innerHTML=`<div style="background:#fff;border-radius:18px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:20px;font-family:inherit"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h2 style="margin:0;font-size:22px">📘 คู่มือ</h2><button id="lpdx" class="ghost">ปิด</button></div><p class="small muted" style="margin:0 0 12px">เปิดอ่านหรือดาวน์โหลดได้ทุกเมื่อ</p><div style="display:flex;flex-direction:column;gap:8px">${list}</div></div>`;
 document.body.appendChild(o);o.onclick=e=>{if(e.target===o)o.remove()};document.getElementById("lpdx").onclick=()=>o.remove()};

/* web edition: 8-item dock fits small phones */
(function(){const st=document.createElement("style");st.textContent="@media (max-width:480px){html body .dock{gap:3px!important;padding:5px!important}html body .dock .dk{min-width:0!important;flex:1 1 0!important;padding:6px 1px!important;gap:1px!important}html body .dock .dk span{white-space:normal!important;font-size:9.5px!important;line-height:1.15;text-align:center;word-break:keep-all}html body .dock .dk svg{width:18px;height:18px}}";document.head.appendChild(st)})();
window.LP_signOut=async()=>{await sb.auth.signOut();location.reload()};
window.LP_start=async function(){
 const{data}=await sb.auth.getSession();session=data.session;
 if(!session){showLogin();return}
 try{const{data:t}=await sb.rpc("is_teacher");isTeacherFlag=!!t}catch(e){isTeacherFlag=false}
 startRealtime();
 const bar=document.createElement("div");bar.style.cssText="position:fixed;right:10px;top:76px;z-index:50;box-shadow:0 4px 12px rgba(19,34,74,.12);font:12px sans-serif;background:#fff;border:1px solid #DDE3EE;border-radius:999px;padding:4px 10px;opacity:.85";
 bar.innerHTML=`<a href="#" onclick="LP_docs();return false" style="font-weight:700">📘 คู่มือ</a> · ${session.user.email} · <a href="#" id="lpout">ออกจากระบบ</a>`;document.body.appendChild(bar);document.getElementById("lpout").onclick=e=>{e.preventDefault();window.LP_signOut()};
 window.boot();
};
})();
</script></head><body><title>LabPass · CEG23167</title>

  --accent:#2f5d7c; --accent-soft:#e3edf4; --mark:#c99a12; --mark-soft:#fff6d6;
  --ok:#2e7d4f; --ok-soft:#e3f3e9; --bad:#b4442c; --bad-soft:#fbe9e4;
  --f-display:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14191d; --sheet:#1c2329; --fg:#e6ebef; --muted:#9aa6b0; --line:#323c45;
  --accent:#7fb2d6; --accent-soft:#22313c; --mark:#e0b93f; --mark-soft:#3a3320;
  --ok:#6cc391; --ok-soft:#1d3327; --bad:#e8836a; --bad-soft:#3a231d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14191d; --sheet:#1c2329; --fg:#e6ebef; --muted:#9aa6b0; --line:#323c45;
  --accent:#7fb2d6; --accent-soft:#22313c; --mark:#e0b93f; --mark-soft:#3a3320;
  --ok:#6cc391; --ok-soft:#1d3327; --bad:#e8836a; --bad-soft:#3a231d; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.65}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.top .in{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.brand small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.8rem;margin-left:6px}
.who{margin-left:auto;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
main{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--f-display);font-size:1.5rem;line-height:1.3;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-size:1.15rem;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:1rem;margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.tab{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
.note{background:var(--mark-soft);border:1px solid var(--mark);border-radius:6px;padding:10px 14px;font-size:14px}
.q{display:flex;flex-direction:column;gap:6px;min-width:0}
.ql{font-weight:600}
input[type=text],input[type=number],input[type=date],textarea,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;box-sizing:border-box}
textarea{min-height:76px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;border-radius:6px;padding:9px 16px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--sheet)}
button.ghost{background:transparent;color:var(--accent)}
button.ghost[aria-pressed="true"]{background:var(--accent);color:var(--sheet)}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.mine{background:var(--accent-soft);border-radius:6px;padding:10px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.mine div{display:flex;flex-direction:column}
.mine span{font-size:12px;color:var(--muted)}
.mine b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mc{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.mc:first-child{border-top:0;padding-top:0}
.opts{display:flex;flex-direction:column;gap:4px}
.opts label{display:flex;gap:8px;align-items:flex-start;font-weight:400}
.opts input{margin-top:6px}
.conf{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.conf label{display:flex;gap:4px;align-items:center}
.unit{font-size:12px;color:var(--muted)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.bq{background:var(--bg);border-radius:6px;padding:10px 12px}
.bq input{background:var(--sheet)}
.fmt{font-size:12px;font-weight:600;color:var(--accent)}
.radar-wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:640px){.radar-wrap{grid-template-columns:1fr}}
.mbar{display:grid;grid-template-columns:44px 1fr 48px;gap:8px;align-items:center;font-size:13px}
.mbar .track{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.mbar .track i{display:block;height:100%;background:var(--accent);border-radius:6px}
.mbar b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.lvl{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.lvl i{font-style:normal;font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--accent-soft);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card .code{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.wait{background:var(--mark-soft);color:var(--fg)}
.score{font-family:var(--f-display);font-size:2.2rem;font-weight:700;line-height:1}
.score small{font-size:1rem;color:var(--muted);font-weight:500}
.fb{border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)} .fb.info{background:var(--accent-soft)}
.fb .h{font-weight:600}
.fb .h.ok{color:var(--ok)} .fb .h.bad{color:var(--bad)}
.breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.breakdown div{background:var(--bg);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column}
.breakdown span{font-size:12px;color:var(--muted)}
.breakdown b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:transparent;color:var(--fg);border-color:var(--line)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--sheet);border-color:var(--accent)}
td.cell{cursor:pointer}
td.cell:hover{background:var(--accent-soft)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.tmsg{display:flex;gap:14px;align-items:flex-start}
.tmsg figure{margin:0;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:84px}
.tmsg img{width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid var(--ok-soft);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.tmsg figcaption{font-size:12px;color:var(--muted);text-align:center}
.tmsg .bubble{position:relative;flex:1;min-width:0;background:var(--ok-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.tmsg .bubble::before{content:"";position:absolute;left:-9px;top:24px;border:9px solid transparent;border-left:0;border-right-color:var(--ok-soft)}
@media (max-width:480px){.tmsg{flex-direction:column;align-items:center}.tmsg .bubble::before{left:50%;top:-9px;transform:translateX(-50%);border:9px solid transparent;border-top:0;border-bottom-color:var(--ok-soft)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;z-index:20}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.dress{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
.stage{width:240px;height:480px;border-radius:16px;overflow:hidden;position:sticky;top:12px}
@media (max-width:640px){.dress{grid-template-columns:1fr}.stage{margin:0 auto;width:200px;height:400px;position:static}}
.itemgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;background:transparent;color:var(--fg);border:1.5px solid var(--line);border-radius:12px;min-height:0}
.item.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.item:disabled{opacity:.55;cursor:not-allowed}
.thumb{position:relative;width:100%;height:90px;display:flex;align-items:center;justify-content:center}
.thumb svg{width:100%;height:100%}
.lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--sheet) 55%,transparent);border-radius:8px}
.iname{font-size:13px;font-weight:600;text-align:center}
.thumb .lock svg{width:26px;height:26px}
.icond{font-size:11px;color:var(--muted);text-align:center;line-height:1.3}
.lvbox{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0 14px}
.lvsteps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.lvstep{border:1.5px solid var(--line);border-radius:10px;padding:8px;text-align:center;opacity:.6}
.lvstep.past{opacity:.85}.lvstep.cur{opacity:1;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.lvn{font-weight:700}.lvt{font-size:13px}.lvr{font-size:11px;color:var(--muted)}
@media (max-width:520px){.lvsteps{grid-template-columns:repeat(2,1fr)}}
.lvgroup{margin-bottom:12px}.lvhead{font-size:14px;margin:0 0 6px}.lvhead.off{color:var(--muted)}
.hbars{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.hb{display:grid;grid-template-columns:minmax(110px,180px) 1fr auto;gap:10px;align-items:center}
.hl{font-size:13px}.hb b{font-family:var(--f-mono);font-size:13px;min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
.ht{height:14px;background:var(--bg);border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.ht.sm{height:8px}
.ht i{display:block;height:100%;border-radius:7px}
.ht i.g{background:var(--ok)}.ht i.y{background:var(--mark)}.ht i.r{background:var(--bad)}.ht i.a{background:var(--accent)}.ht i.n{background:#9aa4ad}
.hb.tot .hl{font-weight:700}.hb.tot .ht{height:18px}
@media (max-width:480px){.hb{grid-template-columns:92px 1fr auto}}
.tsay{display:flex;gap:10px;align-items:flex-start;margin-top:6px}
.tsay img{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--sheet);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.tsay .sb{position:relative;flex:1;min-width:0;background:var(--sheet);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line)}
.tsay .sb::before{content:"";position:absolute;left:-7px;top:14px;width:12px;height:12px;background:var(--sheet);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.tsay .sb{text-align:left}.tsay .twho{font-size:11px;color:var(--muted);font-weight:600}
.tsay.big img{width:56px;height:56px}

/* ===== Theme v2: soft mesh background, frosted glass surfaces, crisp type ===== */
:root{
  --bg:#f5f3f9; --sheet:#ffffff; --fg:#1b1d33; --muted:#606580; --line:#e2dfeb;
  --accent:#3d47a3; --accent-2:#d9548c; --accent-soft:#ecebfa; --mark:#c48a1c; --mark-soft:#fff3d9;
  --ok:#23845a; --ok-soft:#e4f5ec; --bad:#c2453b; --bad-soft:#fdeceb;
  --glass:rgba(255,255,255,.66); --glass-2:rgba(255,255,255,.82); --glass-line:rgba(255,255,255,.85);
  --shadow:0 1px 0 rgba(255,255,255,.9) inset,0 18px 40px -22px rgba(44,36,104,.35),0 4px 12px -6px rgba(44,36,104,.12);
  --shadow-sm:0 1px 0 rgba(255,255,255,.9) inset,0 8px 20px -14px rgba(44,36,104,.35);
  --mesh:radial-gradient(1100px 620px at 8% -8%,#ffd6e5 0,transparent 58%),radial-gradient(900px 560px at 100% 4%,#dad7ff 0,transparent 55%),radial-gradient(900px 700px at 60% 112%,#d3ecff 0,transparent 60%),radial-gradient(600px 400px at -10% 80%,#fff0d6 0,transparent 60%);
  --f-display:"Prompt","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1020; --sheet:#1a1d33; --fg:#eceefa; --muted:#a3a8c3; --line:#2c3050;
  --accent:#9aa6ff; --accent-2:#ff86b5; --accent-soft:#232848; --mark:#f0c25a; --mark-soft:#3a3120;
  --ok:#6fd3a2; --ok-soft:#173329; --bad:#ff8f84; --bad-soft:#3a1f22;
  --glass:rgba(28,31,56,.62); --glass-2:rgba(32,36,64,.85); --glass-line:rgba(255,255,255,.07);
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 20px 44px -22px rgba(0,0,0,.7);
  --shadow-sm:0 1px 0 rgba(255,255,255,.05) inset,0 10px 22px -14px rgba(0,0,0,.7);
  --mesh:radial-gradient(1100px 620px at 8% -8%,rgba(217,84,140,.28) 0,transparent 58%),radial-gradient(900px 560px at 100% 4%,rgba(110,120,255,.28) 0,transparent 55%),radial-gradient(900px 700px at 60% 112%,rgba(60,150,220,.22) 0,transparent 60%);}}
:root[data-theme="dark"]{
  --bg:#0e1020; --sheet:#1a1d33; --fg:#eceefa; --muted:#a3a8c3; --line:#2c3050;
  --accent:#9aa6ff; --accent-2:#ff86b5; --accent-soft:#232848; --mark:#f0c25a; --mark-soft:#3a3120;
  --ok:#6fd3a2; --ok-soft:#173329; --bad:#ff8f84; --bad-soft:#3a1f22;
  --glass:rgba(28,31,56,.62); --glass-2:rgba(32,36,64,.85); --glass-line:rgba(255,255,255,.07);
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 20px 44px -22px rgba(0,0,0,.7);
  --shadow-sm:0 1px 0 rgba(255,255,255,.05) inset,0 10px 22px -14px rgba(0,0,0,.7);
  --mesh:radial-gradient(1100px 620px at 8% -8%,rgba(217,84,140,.28) 0,transparent 58%),radial-gradient(900px 560px at 100% 4%,rgba(110,120,255,.28) 0,transparent 55%),radial-gradient(900px 700px at 60% 112%,rgba(60,150,220,.22) 0,transparent 60%);}
html{background:var(--bg)}
body{background:var(--mesh),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-size:15.5px;letter-spacing:.005em;min-height:100vh}
h1,h2,h3,.brand,.lvl,.score{letter-spacing:-.01em}
h1{font-size:1.7rem;font-weight:600} h2{font-weight:600;font-size:1.25rem} h3{font-weight:600}
.top{background:var(--glass);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid var(--glass-line);box-shadow:0 6px 24px -18px rgba(44,36,104,.4)}
.brand{font-weight:600;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{-webkit-text-fill-color:var(--muted)}
.sheet,.card{background:var(--glass);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--glass-line);border-radius:20px;box-shadow:var(--shadow)}
.sheet{padding:22px 24px}
.card{padding:16px 18px;transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 24px 44px -20px rgba(44,36,104,.4)}
.card h3{font-size:1.05rem}
.tab{display:inline-block;align-self:flex-start;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:999px}
.score{font-weight:700;background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.score small{-webkit-text-fill-color:var(--muted)}
button{border-radius:12px;padding:10px 18px;border:0;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--accent-2)));color:#fff;box-shadow:0 8px 18px -10px color-mix(in srgb,var(--accent) 80%,transparent),0 1px 0 rgba(255,255,255,.25) inset;transition:transform .15s ease,box-shadow .15s ease,filter .15s}
button:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.06)}
button.ghost{background:var(--glass-2);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);box-shadow:var(--shadow-sm)}
button.ghost[aria-pressed="true"],.tabs button[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--accent-2)));color:#fff;border-color:transparent}
.tabs button{background:var(--glass-2);color:var(--fg);border:1px solid var(--line);box-shadow:none}
input[type=text],input[type=number],input[type=date],textarea,select{background:var(--glass-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent);outline:none}
.fb{border-radius:14px;padding:12px 14px;border:1px solid transparent}
.fb.ok{background:color-mix(in srgb,var(--ok-soft) 85%,transparent);border-color:color-mix(in srgb,var(--ok) 18%,transparent)}
.fb.bad{background:color-mix(in srgb,var(--bad-soft) 85%,transparent);border-color:color-mix(in srgb,var(--bad) 18%,transparent)}
.fb.info{background:color-mix(in srgb,var(--accent-soft) 85%,transparent);border-color:color-mix(in srgb,var(--accent) 14%,transparent)}
.note{border-radius:14px}
.mine,.bq,.breakdown div{border-radius:12px}
.bq{background:color-mix(in srgb,var(--glass-2) 70%,transparent);border:1px solid var(--line)}
.pill{padding:3px 11px;box-shadow:0 1px 0 rgba(255,255,255,.6) inset}
.ht,.mbar .track{background:color-mix(in srgb,var(--line) 70%,transparent);border:0;box-shadow:inset 0 1px 2px rgba(30,20,80,.12)}
.ht i,.mbar .track i{box-shadow:0 0 12px -2px currentColor}
.ht i.g{background:linear-gradient(90deg,#45c48a,var(--ok));color:#45c48a}
.ht i.y{background:linear-gradient(90deg,#f6cf63,var(--mark));color:#f6cf63}
.ht i.r{background:linear-gradient(90deg,#f28a7e,var(--bad));color:#f28a7e}
.ht i.a{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:var(--accent-2)}
.ht i.n{background:linear-gradient(90deg,#b9bdd0,#8d92aa);color:transparent}
.tsay .sb,.tsay .sb::before{background:var(--glass-2)}
.tsay .sb{border-radius:14px;box-shadow:var(--shadow-sm)}
.tsay img{border:2px solid #fff;box-shadow:0 4px 12px -4px rgba(44,36,104,.45)}
.lvbox,.lvstep,.item{border-radius:14px;background:var(--glass-2)}
.lvstep.cur,.item.on{box-shadow:0 0 0 2px var(--accent) inset,0 10px 22px -14px var(--accent)}
.stage{border-radius:20px;box-shadow:var(--shadow)}
th{background:color-mix(in srgb,var(--accent-soft) 90%,transparent)}
table{border-radius:12px;overflow:hidden}
@media (prefers-reduced-motion: reduce){.card,button{transition:none}.card:hover{transform:none}}

/* ===== Theme v3: architectural minimal luxury ===== */
:root{
  --bg:#e8edf3; --sheet:#ffffff; --fg:#14171c; --muted:#5f6876; --line:#e3e8ee;
  --accent:#1c2028; --accent-2:#5b7ea6; --accent-soft:#eef2f7; --mark:#b8862b; --mark-soft:#fbf3e3;
  --ok:#1f8a5b; --ok-soft:#e7f5ee; --bad:#c24b3f; --bad-soft:#fcecea;
  --glass:#ffffff; --glass-2:#f6f8fb; --glass-line:#e6ebf1;

function grade(mid,sid,sub){
 if(!sub)return null;
 const m=MISSIONS.find(x=>x.id===mid);
 if(m.type==="test"){let n=0;T.forEach((it,i)=>{const a=sub.T?.[i];if(a&&+a.a===it.k&&+a.r===it.rk)n++});return{test:n,max:10}}
 const items=A[mid];let a=0;items.forEach((it,i)=>{if(+sub.A?.[i]?.a===it.k)a+=0.5});
 const g=gradeB(mid,sid,sub.B||{});const keys=Object.keys(g);const nb=keys.filter(k=>g[k].ok).length;const b=5*nb/keys.length;
 const d=(sub.D?.muddy||"").trim()&&sub.D?.conf&&sub.D?.time?0.5:0;
 return{A:a,B:Math.round(b*100)/100,D:d,auto:Math.round((a+b+d)*100)/100,bItems:g,nb,nbMax:keys.length}
}

function cInfo(sub,tg){
 if(tg&&tg.c!=null)return{level:+tg.c,score:Math.round(+tg.c*2/3*100)/100,by:"อาจารย์"};
 const it=sub?.Cauto?.items;if(!it)return null;const lv=it.reduce((s,x)=>s+(+x.level||0),0)/it.length;
 return{level:Math.round(lv*100)/100,score:Math.round(lv*2/3*100)/100,by:sub.Cauto.by==="claude"?"Claude":"ระบบคำสำคัญ"}}
function full(mid,sid,sub,tg){const g=grade(mid,sid,sub);if(!g||g.test!=null)return g;const c=cInfo(sub,tg);return{...g,C:c?c.score:null,cInfo:c,total:Math.round((g.auto+(c?c.score:0))*100)/100}}

/* Automatic overall advice */
function advice(mid,sub,g){
 const out=[];const t=g.total??g.auto;
 out.push(t>=8.5?"ทำได้ดีมาก พร้อมเข้าแล็บนี้แล้ว":t>=6.5?"พื้นฐานดีแล้ว ทบทวนข้อที่ยังไม่ถูกด้านล่างก่อนเข้าแล็บ":"ยังมีหลายจุดที่ควรทบทวน อ่าน Lab sheet ตามคำแนะนำแต่ละข้อ แล้วลองคำนวณใหม่ในช่องทดก่อนเข้าแล็บ");
 const mis=A[mid].filter((it,i)=>+sub.A[i].a!==it.k&&sub.A[i].c==="1");
 if(mis.length)out.push(`มี ${mis.length} ข้อในส่วน A ที่ตอบผิดแต่เลือกว่ามั่นใจ เป็นความเข้าใจคลาดเคลื่อนที่ควรแก้ก่อนเข้าแล็บ`);
 const wrongB=B[mid].filter(f=>!g.bItems[f.k].ok);
 if(wrongB.length)out.push(`ส่วน B ควรคำนวณใหม่: ${wrongB.map(f=>f.l.split("·").pop().trim()).join(", ")}`);
 else out.push("ส่วน B คำนวณถูกครบทุกข้อ");
 if(sub.D?.conf&&+sub.D.conf<=2&&t>=8)out.push("คุณประเมินตัวเองว่ายังไม่มั่นใจ แต่ผลออกมาดี ลองเชื่อมั่นในวิธีคิดของตัวเองมากขึ้น");
 return out}

function onTime(mid,sub,sec){const d=S(mid,sec).due;return !d||new Date(sub.at)<=new Date(d+"T23:59:59")}
function power(missions,sid,grades,sec){
 const ids=["M1","M2","M3","M4","M5"];const done=ids.filter(id=>missions?.[id]);
 if(!done.length)return null;
 let a=0,b=0,c=0,cn=0,d=0,calOk=0,calN=0,tot=0;const per={};
 const ev={aOk:0,aN:0,bOk:0,bN:0,cLv:[],dOk:0,over:0,under:0,mis:[],bWrong:[],lowC:[],muddy:[],perA:{},perB:{},perC:{}};
 done.forEach(id=>{const sub=missions[id];const g=full(id,sid,sub,grades?.[id]);a+=g.A/2.5;b+=g.B/5;d+=g.D/0.5;tot+=g.total;per[id]=g.total;
  ev.perA[id]=g.A/2.5*100;ev.perB[id]=g.B/5*100;
  if(g.C!=null){c+=g.C/2;cn++;ev.perC[id]=g.C/2*100;ev.cLv.push(g.cInfo.level)}
  if(g.D===0.5)ev.dOk++;if(sub.D?.muddy)ev.muddy.push({id,t:sub.D.muddy});
  A[id].forEach((it,i)=>{const x=sub.A[i];ev.aN++;const ok=+x.a===it.k;if(ok)ev.aOk++;if(x?.c==null)return;calN++;
   if((ok&&x.c==="1")||(!ok&&x.c==="0"))calOk++;if(!ok&&x.c==="1"){ev.over++;ev.mis.push({id,q:it.q,h:it.h})}if(ok&&x.c==="0")ev.under++});
  B[id].forEach(f=>{ev.bN++;const r=g.bItems[f.k];if(r.ok)ev.bOk++;else ev.bWrong.push({id,l:f.l,h:r.hint})});
  (sub.Cauto?.items||[]).forEach((it,i)=>{if(+it.level<2)ev.lowC.push({id,q:C[id][i].q,lv:+it.level,fb:it.feedback})})});
 const today=new Date();const missed=ids.filter(id=>!missions?.[id]&&S(id,sec).open&&S(id,sec).due&&new Date(S(id,sec).due+"T23:59:59")<today);
 const ont=done.filter(id=>onTime(id,missions[id],sec)).length;
 const n=done.length;const v={A:a/n*100,B:b/n*100,C:cn?c/cn*100:0,cal:calN?calOk/calN*100:0,D:d/n*100,time:ont/(n+missed.length)*100};
 Object.assign(ev,{calOk,calN,ont,missed,done,late:done.filter(id=>!onTime(id,missions[id],sec))});
 return{n,v,per,pct:tot/(10*n)*100,tot,ev}}

 return`${nick} อาจารย์เห็นความตั้งใจจากงานที่ส่งมาทั้ง ${P.n} ภารกิจเลยนะคะ จุดที่ทำได้ดีมากคือด้าน${sorted[0].l} เก็บจุดแข็งนี้ไว้ให้ดี ส่วนด้าน${sorted.at(-1).l}ยังพัฒนาได้อีก ค่อย ๆ ทำตามแนวทางด้านบนทีละข้อก็พอค่ะ ถ้าตรงไหนยังงง ทักมาถามอาจารย์ได้ตลอดนะคะ อาจารย์เป็นกำลังใจให้ค่ะ`}
function insightHTML(P){
 const ins=me.insight;const fresh=ins&&ins.sig===insightSig(me.missions);
 if(!fresh&&!insightRunning&&!insightFailed)setTimeout(()=>makeInsight(P),0);
 const use=fresh||(ins&&insightFailed)?ins:null;
 const head=`บทวิเคราะห์ส่วนตัวจากอาจารย์ลีลาวรรณ`;
 if(!use&&!insightFailed)return`<div class="fb info"><div class="h">${head}</div><div class="small">อาจารย์กำลังอ่านงานของคุณ รอสักครู่นะคะ…</div></div>`;
 const msg=use?.message||teacherMsgFallback(P);
 return`${use?`<div class="fb info"><div class="h">${head}</div>
  <div>${esc(use.summary)}</div>${use.learner?`<div><b>ลักษณะการเรียนรู้ของคุณ:</b> ${esc(use.learner)}</div>`:""}
  ${use.focus?.length?`<div><b>เรื่องที่ควรทบทวน</b></div><ul style="margin:0;padding-left:20px">${use.focus.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
  ${use.habits?.length?`<div><b>นิสัยการเรียนที่แนะนำ</b></div><ul style="margin:0;padding-left:20px">${use.habits.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}</div>`:""}

const ROSE_C=["#f08a8a","#e5679a","#b86fc4","#8a83d8","#5fa3d6","#f2a774"];
function radarSVG(v,avg){/* glow rose chart: petal AREA proportional to score */
 const W=520,H=400,cx=260,cy=196,R=138,n=AXES.length,gap=3*Math.PI/180;
 const pt=(r,a)=>[cx+r*Math.sin(a),cy-r*Math.cos(a)];const rad=x=>R*Math.sqrt(Math.max(0,Math.min(100,x||0))/100);
 const wedge=(i,r)=>{const a0=(i*60-30)*Math.PI/180+gap,a1=(i*60+30)*Math.PI/180-gap;const[x0,y0]=pt(r,a0),[x1,y1]=pt(r,a1);return`M${cx} ${cy} L${x0.toFixed(1)} ${y0.toFixed(1)} A${r.toFixed(1)} ${r.toFixed(1)} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z`};
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Rose chart ค่าพลังหกด้าน" style="max-width:500px;display:block;margin:0 auto"><defs><filter id="roseGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>`;
 AXES.forEach((a,i)=>s+=`<radialGradient id="roseG${i}" cx="${cx}" cy="${cy}" r="${R}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${ROSE_C[i]}" stop-opacity=".22"/><stop offset=".7" stop-color="${ROSE_C[i]}" stop-opacity=".58"/><stop offset="1" stop-color="${ROSE_C[i]}" stop-opacity=".85"/></radialGradient>`);
 s+=`</defs>`;
 [25,50,75,100].forEach(p=>{const r=rad(p);s+=`<circle cx="${cx}" cy="${cy}" r="${r.toFixed(1)}" fill="none" stroke="var(--line)" ${p<100?'stroke-dasharray="3 4"':""}/><text x="${cx+3}" y="${(cy-r+11).toFixed(1)}" font-size="9" fill="var(--muted)">${p}</text>`});
 AXES.forEach((a,i)=>s+=`<path d="${wedge(i,Math.max(6,rad(v[a.k])))}" fill="${ROSE_C[i]}" opacity=".45" filter="url(#roseGlow)"/>`);
 AXES.forEach((a,i)=>{const r=Math.max(6,rad(v[a.k]));s+=`<path d="${wedge(i,r)}" fill="url(#roseG${i})" stroke="${ROSE_C[i]}" stroke-width="1.5" stroke-linejoin="round"/>`;
  if(r>24){const a0=(i*60-24)*Math.PI/180+gap,a1=(i*60-6)*Math.PI/180,rr=r*.86;const[x0,y0]=pt(rr,a0),[x1,y1]=pt(rr,a1);s+=`<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${rr.toFixed(1)} ${rr.toFixed(1)} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="#fff" stroke-width="${Math.max(2,r*.07).toFixed(1)}" stroke-linecap="round" fill="none" opacity=".75"/>`}
  if(avg){const ra=Math.max(6,rad(avg[a.k])),b0=(i*60-30)*Math.PI/180+gap,b1=(i*60+30)*Math.PI/180-gap;const[x0,y0]=pt(ra,b0),[x1,y1]=pt(ra,b1);s+=`<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${ra.toFixed(1)} ${ra.toFixed(1)} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="var(--fg)" stroke-width="1.6" stroke-dasharray="4 3" fill="none" opacity=".7"/>`}
  const[lx,ly]=pt(R+30,i*60*Math.PI/180);const anc=Math.abs(lx-cx)<20?"middle":lx>cx?"start":"end";
  s+=`<text x="${lx.toFixed(1)}" y="${(ly-2).toFixed(1)}" text-anchor="${anc}" font-size="13" font-weight="600" fill="var(--fg)">${a.l}</text><text x="${lx.toFixed(1)}" y="${(ly+15).toFixed(1)}" text-anchor="${anc}" font-size="13" font-weight="700" font-family="var(--f-mono)" fill="${ROSE_C[i]}" style="filter:brightness(.8)">${Math.round(v[a.k]||0)}</text>`});
 return s+`<circle cx="${cx}" cy="${cy}" r="3" fill="#fff" stroke="var(--line)"/></svg>`}
function roseGuide(avg){return`<details class="fb info rg" style="margin-top:6px"><summary class="h" style="cursor:pointer">วิธีอ่านกราฟนี้ (Rose Chart)</summary>
 <div class="small">หรือเรียกว่า Nightingale Rose Chart ตามชื่อฟลอเรนซ์ ไนติงเกล ผู้คิดกราฟแบบนี้ขึ้นมา</div>
 <div class="small"><b>วิธีดู</b></div>
 <div class="small">• 1 กลีบ = ค่าพลัง 1 ด้าน แต่ละด้านมีสีของตัวเอง</div>
 <div class="small">• กลีบยิ่งใหญ่ = คะแนนด้านนั้นยิ่งสูง (ขนาดพื้นที่กลีบเทียบกับคะแนน 0–100)</div>
 <div class="small">• วงกลมเส้นประบอกระดับ 25 / 50 / 75 / 100 กลีบที่แตะวงนอกสุดคือเต็ม 100</div>
 <div class="small">• ตัวเลขใต้ชื่อด้านคือคะแนนจริงของด้านนั้น</div>
 <div class="small">• กลีบที่เล็กที่สุดคือด้านที่ควรพัฒนาก่อน กลีบใหญ่สุดคือจุดแข็งของคุณ</div>
 ${avg?`<div class="small">• เส้นประสีเข้มบนแต่ละกลีบ = ค่าเฉลี่ยของห้อง กลีบที่ยื่นเกินเส้นประแปลว่าคุณทำได้ดีกว่าค่าเฉลี่ย</div>`:""}</details>`}
function teacherDeep(P,sorted,avg){
 const ev=P.ev;
 let strong=sorted.filter(a=>a.val>=60).slice(0,2);if(!strong.length)strong=[sorted[0]];
 let weak=sorted.slice().reverse().filter(a=>a.val<85&&!strong.includes(a)).slice(0,2);
 const cmp=a=>avg?` · ${a.val>=avg[a.k]?"สูงกว่า":"ต่ำกว่า"}ค่าเฉลี่ยห้อง ${Math.abs(Math.round(a.val-avg[a.k]))} คะแนน`:"";
 const card=(a,ok)=>`<div class="fb ${ok?"ok":"bad"}"><div class="h ${ok?"ok":"bad"}">${a.l} · ${Math.round(a.val)}/100</div>
  <div class="small"><b>หลักฐาน:</b> ${axisEvidence(a.k,ev)}${cmp(a)}</div><div class="small">${ok?STRONG_TXT[a.k]:WEAK_TXT[a.k]}</div></div>`;
 const misL=ev.mis.slice(0,6).map(x=>`<li><b>${x.id}</b> ${x.q}<div class="small muted">${x.h}</div></li>`).join("");
 const bL=ev.bWrong.slice(0,6).map(x=>`<li><b>${x.id}</b> ${x.l.split("·").pop().trim()}<div class="small muted">${x.h||""}</div></li>`).join("");
 return`<div style="display:flex;flex-direction:column;gap:14px;margin-top:10px">
  <div class="grid2" style="align-items:start"><div style="display:flex;flex-direction:column;gap:8px"><h3>ด้านที่สูงสุด</h3>${strong.map(a=>card(a,true)).join("")}</div>
   <div style="display:flex;flex-direction:column;gap:8px"><h3>ด้านที่ต่ำสุด</h3>${weak.length?weak.map(a=>card(a,false)).join(""):`<div class="small">ทุกด้าน 85 ขึ้นไป</div>`}</div></div>
  ${misL?`<div><h3>ตอบผิดแต่มั่นใจ (ความเข้าใจคลาดเคลื่อน)</h3><ul style="margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px">${misL}</ul></div>`:`<div class="small muted">ไม่พบข้อที่ตอบผิดแต่มั่นใจ</div>`}
  ${bL?`<div><h3>ข้อคำนวณที่ผิด</h3><ul style="margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px">${bL}</ul></div>`:""}
  <div class="small muted">ค่าพลังทั้ง 6 ด้าน ระดับ Bloom รายคน และคำตอบรายข้อ ส่งออกได้ครบในไฟล์ Excel ที่หน้าอาจารย์</div></div>`}

function fcAtWc(w){const P=GRAPHS.wc.pts;if(w<=P[0][0])return P[0][1]+(P[0][0]-w)/(P[1][0]-P[0][0])*(P[0][1]-P[1][1]);for(let i=0;i<P.length-1;i++){const[a,fa]=P[i],[b,fb]=P[i+1];if(w<=b)return fa+(fb-fa)*(w-a)/(b-a)}const n=P.length-1;return P[n][1]-(w-P[n][0])/(P[n][0]-P[n-1][0])*(P[n-1][1]-P[n][1])}

const junk=t=>{const x=String(t||"").replace(/\s/g,"");return x.length<20||/(.)\1{4,}/.test(x)||/^[\d\p{P}\p{S}_]+$/u.test(x)||/^(ไม่รู้|ไม่ทราบ|ไม่แน่ใจ|งง|ok|-|\.)+$/i.test(x)};
function effortFlags(mid,sub){const f=[];const m=MISSIONS.find(x=>x.id===mid);
 if(m.type==="test"){const as=(sub.T||[]).map(x=>x.a);if(as.length>3&&as.every(a=>a===as[0]))f.push("เลือกคำตอบเดียวกันทุกข้อ");return f}
 const as=(sub.A||[]).map(x=>x.a);if(as.length>2&&as.every(a=>a===as[0]))f.push("ส่วน A เลือกตัวเลือกเดียวกันทุกข้อ");
 const bv=B[mid].filter(x=>!x.sel).map(x=>String(sub.B?.[x.k]??"").trim()).filter(Boolean);if(bv.length>=3&&new Set(bv).size===1)f.push("ส่วน B ใส่ตัวเลขเดียวกันทุกข้อ");
 const cs=(sub.C||[]);const jc=cs.map((t,i)=>junk(t)?i+1:0).filter(Boolean);if(jc.length)f.push("ส่วน C ข้อ "+jc.join(", ")+" สั้นหรือไม่มีเนื้อหา");
 const norm=t=>String(t||"").replace(/\s/g,"");if(cs.length>1&&new Set(cs.map(norm)).size<cs.length)f.push("ส่วน C มีคำตอบซ้ำกัน");
 if(cs.some((t,i)=>norm(t).length>10&&norm(C[mid][i].q).includes(norm(t))))f.push("ส่วน C คัดลอกคำถามมาตอบ");
 if(sub.TM&&sub.TM.total<480)f.push(`ใช้เวลาเพียง ${Math.max(1,Math.round(sub.TM.total/60))} นาที`);
 return f}

function codeGrid(code){/* decorative matrix pattern from student id (not a scannable QR) */
 let h=0;for(const c of String(code))h=(h*31+c.charCodeAt(0))>>>0;const N=21,cell=4;let r="";
 const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296};
 const finder=(x,y)=>`<rect x="${x*cell}" y="${y*cell}" width="${7*cell}" height="${7*cell}" fill="#0b1020"/><rect x="${x*cell+cell}" y="${y*cell+cell}" width="${5*cell}" height="${5*cell}" fill="#fff"/><rect x="${x*cell+2*cell}" y="${y*cell+2*cell}" width="${3*cell}" height="${3*cell}" fill="#0b1020"/>`;
 const inF=(x,y)=>(x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!inF(x,y)&&rnd()>.52)r+=`<rect x="${x*cell}" y="${y*cell}" width="${cell}" height="${cell}" fill="#0b1020"/>`;
 return`<svg viewBox="-4 -4 ${N*cell+8} ${N*cell+8}" width="84" height="84" aria-hidden="true"><rect x="-4" y="-4" width="${N*cell+8}" height="${N*cell+8}" rx="4" fill="#fff"/>${r}${finder(0,0)}${finder(14,0)}${finder(0,14)}</svg>`}
